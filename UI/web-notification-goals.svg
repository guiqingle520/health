<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
<title id="title">Web 通知提醒与目标设定页</title>
<desc id="desc">HealthGuard Web notification and goal settings prototype.</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}</style>
<defs><filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#12343C" flood-opacity="0.10"/></filter></defs>
<rect x="0" y="0" width="1440" height="1024" fill="#F4FAF8"/>
<rect x="40" y="36" width="222" height="952" rx="24" fill="#FFFFFF" filter="url(#softShadow)"/>
<circle cx="82" cy="88" r="22" fill="#DDF5EF"/><path d="M72 88h20M82 78v20" stroke="#15A3A3" fill="none" stroke-width="3" stroke-linecap="round"/>
<text x="116" y="82" font-size="22" fill="#173844" font-weight="800">HealthGuard</text><text x="116" y="108" font-size="13" fill="#61727B" font-weight="600">Web 工作台</text>
