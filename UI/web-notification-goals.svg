<rect x="62" y="198" width="156" height="42" rx="12" fill="transparent"/><circle cx="84" cy="219" r="6" fill="#DCE9E6"/><text x="104" y="224" font-size="15" fill="#61727B" font-weight="600">健康档案</text>
<rect x="62" y="256" width="156" height="42" rx="12" fill="transparent"/><circle cx="84" cy="277" r="6" fill="#DCE9E6"/><text x="104" y="282" font-size="15" fill="#61727B" font-weight="600">记录</text>
<rect x="62" y="314" width="156" height="42" rx="12" fill="transparent"/><circle cx="84" cy="335" r="6" fill="#DCE9E6"/><text x="104" y="340" font-size="15" fill="#61727B" font-weight="600">AI 洞察</text>
<rect x="62" y="372" width="156" height="42" rx="12" fill="transparent"/><circle cx="84" cy="393" r="6" fill="#DCE9E6"/><text x="104" y="398" font-size="15" fill="#61727B" font-weight="600">报告中心</text>
<rect x="62" y="430" width="156" height="42" rx="12" fill="#F3FBF9" stroke="#DCE9E6"/><circle cx="84" cy="451" r="6" fill="#15A3A3"/><text x="104" y="456" font-size="15" fill="#087B83" font-weight="800">设置</text>
<rect x="62" y="902" width="156" height="52" rx="16" fill="#F8FCFB" stroke="#DCE9E6"/><text x="82" y="926" font-size="13" fill="#61727B" font-weight="500">账号</text><text x="82" y="948" font-size="16" fill="#173844" font-weight="800">张先生</text>

<rect x="300" y="36" width="1100" height="72" rx="22" fill="#FFFFFF" filter="url(#softShadow)"/>
<text x="332" y="82" font-size="26" fill="#173844" font-weight="800">通知提醒与目标设定</text>
<rect x="1260" y="56" width="112" height="36" rx="18" fill="#15A3A3"/><text x="1316" y="79" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">保存设置</text>

<rect x="300" y="136" width="540" height="812" rx="24" fill="#FFFFFF" filter="url(#softShadow)"/>
<text x="336" y="186" font-size="24" fill="#173844" font-weight="900">通知提醒</text>
<text x="336" y="214" font-size="14" fill="#61727B" font-weight="600">饮水、运动、睡眠、周报和目标提醒</text>
<rect x="336" y="248" width="468" height="64" rx="18" fill="#F8FCFB" stroke="#DCE9E6"/>
<text x="364" y="286" font-size="16" fill="#173844" font-weight="900">饮水提醒</text><text x="672" y="286" font-size="13" fill="#61727B" font-weight="700">21:00</text><rect x="760" y="262" width="44" height="24" rx="12" fill="#15A3A3"/><circle cx="788" cy="274" r="10" fill="#FFFFFF"/>
<rect x="336" y="326" width="468" height="64" rx="18" fill="#F8FCFB" stroke="#DCE9E6"/>
<text x="364" y="364" font-size="16" fill="#173844" font-weight="900">运动提醒</text><text x="672" y="364" font-size="13" fill="#61727B" font-weight="700">18:00</text><rect x="760" y="340" width="44" height="24" rx="12" fill="#15A3A3"/><circle cx="788" cy="352" r="10" fill="#FFFFFF"/>
<rect x="336" y="404" width="468" height="64" rx="18" fill="#F8FCFB" stroke="#DCE9E6"/>
<text x="364" y="442" font-size="16" fill="#173844" font-weight="900">睡眠提醒</text><text x="672" y="442" font-size="13" fill="#61727B" font-weight="700">22:30</text><rect x="760" y="418" width="44" height="24" rx="12" fill="#15A3A3"/><circle cx="788" cy="430" r="10" fill="#FFFFFF"/>
<rect x="336" y="482" width="468" height="64" rx="18" fill="#F8FCFB" stroke="#DCE9E6"/>
<text x="364" y="520" font-size="16" fill="#173844" font-weight="900">周报提醒</text><text x="672" y="520" font-size="13" fill="#61727B" font-weight="700">周日 20:00</text><rect x="760" y="496" width="44" height="24" rx="12" fill="#15A3A3"/><circle cx="788" cy="508" r="10" fill="#FFFFFF"/>
<rect x="336" y="560" width="468" height="86" rx="18" fill="#F8FCFB" stroke="#DCE9E6"/>
<text x="364" y="598" font-size="16" fill="#173844" font-weight="900">静默时段</text><text x="364" y="626" font-size="13" fill="#61727B" font-weight="600">23:00 - 07:00，跨天时段自动解析</text>

<rect x="872" y="136" width="528" height="812" rx="24" fill="#FFFFFF" filter="url(#softShadow)"/>
<text x="908" y="186" font-size="24" fill="#173844" font-weight="900">目标设定</text>
<text x="908" y="214" font-size="14" fill="#61727B" font-weight="600">目标会驱动趋势、报告和 AI 建议</text>
<rect x="908" y="248" width="452" height="78" rx="18" fill="#EEFBF8" stroke="#CFECE5"/>
<text x="936" y="286" font-size="16" fill="#173844" font-weight="900">今日目标概览</text>
<text x="936" y="312" font-size="13" fill="#61727B" font-weight="600">饮水 2000ml · 步数 8000 · 睡眠 7.5h</text>
<rect x="908" y="348" width="120" height="42" rx="21" fill="#DDF5EF"/><text x="968" y="375" font-size="14" fill="#087B83" font-weight="900" text-anchor="middle">饮水 2L</text>
<rect x="1040" y="348" width="120" height="42" rx="21" fill="#F8FCFB" stroke="#DCE9E6"/><text x="1100" y="375" font-size="14" fill="#61727B" font-weight="800" text-anchor="middle">步数 8K</text>
<rect x="1172" y="348" width="120" height="42" rx="21" fill="#F8FCFB" stroke="#DCE9E6"/><text x="1232" y="375" font-size="14" fill="#61727B" font-weight="800" text-anchor="middle">睡眠 7.5h</text>
<rect x="908" y="418" width="120" height="42" rx="21" fill="#F8FCFB" stroke="#DCE9E6"/><text x="968" y="445" font-size="14" fill="#61727B" font-weight="800" text-anchor="middle">体重 -2kg</text>
<rect x="1040" y="418" width="120" height="42" rx="21" fill="#F8FCFB" stroke="#DCE9E6"/><text x="1100" y="445" font-size="14" fill="#61727B" font-weight="800" text-anchor="middle">热量 1800</text>
<rect x="1172" y="418" width="120" height="42" rx="21" fill="#F8FCFB" stroke="#DCE9E6"/><text x="1232" y="445" font-size="14" fill="#61727B" font-weight="800" text-anchor="middle">每周 5 天</text>
<rect x="908" y="494" width="452" height="110" rx="18" fill="#F8FCFB" stroke="#DCE9E6"/>
<text x="936" y="532" font-size="16" fill="#173844" font-weight="900">联动说明</text>
<text x="936" y="560" font-size="13" fill="#61727B" font-weight="600">目标保存后，首页、趋势、AI 建议和报告摘要会同步刷新。</text>
<text x="936" y="586" font-size="13" fill="#61727B" font-weight="600">未达成目标时，AI 建议会优先提示可执行动作而不是抽象结论。</text>
</svg>
