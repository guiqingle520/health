<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
<title id="title">Web 报告与分享页</title><desc id="desc">HealthGuard Web report and sharing prototype.</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}.muted{fill:#61727B}.ink{fill:#173844}.teal{fill:#087B83}.label{font-size:14px;font-weight:800}.small{font-size:13px}.h1{font-size:30px;font-weight:900}.h2{font-size:18px;font-weight:900}.num{font-size:28px;font-weight:900}.line{stroke:#DCE9E6;stroke-width:1}</style>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#12343C" flood-opacity="0.10"/></filter></defs>
