<text x="330" y="206" class="ink h2">2026 年 5 月健康月报</text><text x="330" y="236" class="muted small">生成时间：2026-05-20 09:30    周期：2026-05-01 至 2026-05-20</text>
<rect x="330" y="272" width="190" height="116" rx="18" fill="#F3FBF9"/><text x="356" y="306" class="muted label">健康分均值</text><text x="356" y="348" class="ink num">81</text><text x="356" y="372" class="teal small">较上月 +5</text>
<rect x="542" y="272" width="190" height="116" rx="18" fill="#FFF7ED"/><text x="568" y="306" class="muted label">风险提示</text><text x="568" y="348" class="ink num">2 项</text><text x="568" y="372" class="muted small">睡眠、心率</text>
<rect x="754" y="272" width="220" height="116" rx="18" fill="#F8FCFB"/><text x="780" y="306" class="muted label">目标完成</text><text x="780" y="348" class="ink num">76%</text><text x="780" y="372" class="muted small">饮水目标不足</text>
<text x="330" y="438" class="ink h2">核心摘要</text><rect x="330" y="466" width="644" height="122" rx="18" fill="#F8FCFB" stroke="#DCE9E6"/><text x="356" y="506" class="ink label">本月体重稳定下降，运动频次较上月提升；睡眠时长稳定但入睡时间偏晚。</text><text x="356" y="538" class="muted small">报告不提供诊断结论，异常指标以趋势提示和就医建议边界展示。</text>
<text x="330" y="640" class="ink h2">趋势与建议</text><rect x="330" y="668" width="644" height="86" rx="18" fill="#FFFFFF" stroke="#DCE9E6"/><text x="356" y="702" class="ink label">1. 睡眠：平均 7.1 小时，建议固定 23:30 前入睡</text><text x="356" y="730" class="muted small">证据：睡眠记录、Garmin 同步、目标设定</text>
<rect x="330" y="770" width="644" height="86" rx="18" fill="#FFFFFF" stroke="#DCE9E6"/><text x="356" y="804" class="ink label">2. 饮水：平均达成 78%，建议午后固定补水提醒</text><text x="356" y="832" class="muted small">证据：饮水记录、通知目标设置</text>
