<text x="104" y="166" class="muted label">记录中心</text><circle cx="84" cy="161" r="6" fill="#DCE9E6"/><text x="104" y="224" class="muted label">数据趋势</text><circle cx="84" cy="219" r="6" fill="#DCE9E6"/><text x="104" y="282" class="muted label">AI 建议</text><circle cx="84" cy="277" r="6" fill="#DCE9E6"/><rect x="62" y="314" width="156" height="42" rx="12" fill="#F3FBF9"/><circle cx="84" cy="335" r="6" fill="#15A3A3"/><text x="104" y="340" class="teal label">报告分享</text><text x="104" y="398" class="muted label">家庭共享</text><circle cx="84" cy="393" r="6" fill="#DCE9E6"/><text x="104" y="456" class="muted label">医生协作</text><circle cx="84" cy="451" r="6" fill="#DCE9E6"/>
<text x="300" y="88" class="muted small">报告与分享 / 月报</text><text x="300" y="128" class="ink h1">健康报告中心</text><rect x="1110" y="76" width="124" height="40" rx="14" fill="#FFFFFF" stroke="#DCE9E6"/><text x="1172" y="101" text-anchor="middle" class="teal label">导出 PDF</text><rect x="1252" y="76" width="132" height="40" rx="14" fill="#15A3A3"/><text x="1318" y="101" text-anchor="middle" fill="#FFFFFF" class="label">生成报告</text>
