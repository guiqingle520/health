<text x="102" y="742" font-size="13" fill="#60708F" font-weight="600">一次轻度有氧能帮助稳定夜间血糖与情绪状态。</text><rect x="102" y="770" width="72" height="30" rx="15" fill="#00A79D"/><text x="138" y="790" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle">采纳建议</text><rect x="184" y="770" width="82" height="30" rx="15" fill="#EEFBF8"/><text x="225" y="790" font-size="12" fill="#008B82" font-weight="700" text-anchor="middle">稍后再说</text><rect x="34" y="777" width="362" height="62" rx="26" fill="#FFFFFF" filter="url(#navShadow)"/><text x="80" y="804" font-size="24" fill="#60708F" font-weight="700" text-anchor="middle">⌂</text><text x="80" y="825" font-size="12" fill="#60708F" font-weight="600" text-anchor="middle">首页</text><text x="164" y="804" font-size="24" fill="#60708F" font-weight="700" text-anchor="middle">▥</text><text x="164" y="825" font-size="12" fill="#60708F" font-weight="600" text-anchor="middle">数据</text><text x="248" y="804" font-size="24" fill="#00A79D" font-weight="700" text-anchor="middle">✣</text><text x="248" y="825" font-size="12" fill="#008B82" font-weight="600" text-anchor="middle">AI 建议</text><text x="332" y="804" font-size="24" fill="#60708F" font-weight="700" text-anchor="middle">♙</text><text x="332" y="825" font-size="12" fill="#60708F" font-weight="600" text-anchor="middle">我的</text></svg>
