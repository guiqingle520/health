    <rect x="852" y="136" width="548" height="220" rx="24" fill="#FFFFFF" filter="url(#softShadow)"/><text x="884" y="184" font-size="24" fill="#173844" font-weight="900">陪伴摘要</text><rect x="1248" y="154" width="102" height="36" rx="18" fill="#DDF5EF"/><text x="1299" y="177" font-size="14" fill="#087B83" font-weight="700" text-anchor="middle">上下文</text><text x="884" y="224" font-size="19" fill="#173844" font-weight="800">2 次互动 · 35 分钟 · 情绪 +1.5</text><text x="884" y="264" font-size="16" fill="#61727B" font-weight="600">晚间陪伴帮助情绪回稳；短时互动支持步行习惯。</text><text x="884" y="300" font-size="16" fill="#F27D63" font-weight="700">睡眠不足可能降低主动互动质量，建议今晚提前 20 分钟休息。</text>
    <rect x="300" y="566" width="520" height="382" rx="24" fill="#FFFFFF" filter="url(#softShadow)"/><text x="332" y="614" font-size="24" fill="#173844" font-weight="900">今日营养与运动</text><rect x="332" y="654" width="420" height="8" rx="4" fill="#EAF1EF"/><rect x="332" y="654" width="302.4" height="8" rx="4" fill="#15A3A3"/><text x="332" y="688" font-size="16" fill="#173844" font-weight="700">蛋白质 68g / 90g</text><rect x="332" y="724" width="420" height="8" rx="4" fill="#EAF1EF"/><rect x="332" y="724" width="268.8" height="8" rx="4" fill="#F2BF4B"/><text x="332" y="758" font-size="16" fill="#173844" font-weight="700">碳水 210g / 330g</text><rect x="332" y="794" width="420" height="8" rx="4" fill="#EAF1EF"/><rect x="332" y="794" width="193.20000000000002" height="8" rx="4" fill="#F27D63"/><text x="332" y="828" font-size="16" fill="#173844" font-weight="700">运动消耗 280 / 600 kcal</text><rect x="332" y="866" width="420" height="46" rx="14" fill="#F8FCFB" stroke="#DCE9E6" stroke-width="1"/><text x="356" y="895" font-size="15" fill="#61727B" font-weight="600">晚餐建议：增加蛋白，减少高油主食。</text>
