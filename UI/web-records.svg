<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
<title id="title">Web 记录中心页</title><desc id="desc">HealthGuard Web record center prototype.</desc>
<style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}.muted{fill:#61727B}.ink{fill:#173844}.teal{fill:#087B83}.small{font-size:13px}.label{font-size:14px;font-weight:700}.h1{font-size:30px;font-weight:900}.h2{font-size:18px;font-weight:900}.num{font-size:28px;font-weight:900}.cell{font-size:15px;fill:#173844}.soft{fill:#F4FAF8}.line{stroke:#DCE9E6;stroke-width:1}
</style>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#12343C" flood-opacity="0.10"/></filter></defs>
