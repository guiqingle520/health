<text x="656" y="590" font-size="16" fill="#173844" font-weight="900">한국어</text><text x="1000" y="590" font-size="14" fill="#61727B" font-weight="700">ko</text>

<text x="628" y="668" font-size="20" fill="#173844" font-weight="900">单位偏好</text>
