<rect x="1140" y="136" width="260" height="812" rx="24" fill="#FFFFFF" filter="url(#softShadow)"/>
<text x="1172" y="184" font-size="22" fill="#173844" font-weight="900">国际化策略</text>
<rect x="1172" y="224" width="196" height="112" rx="18" fill="#EEFBF8"/>
<text x="1196" y="258" font-size="14" fill="#087B83" font-weight="900">当前</text>
<text x="1196" y="288" font-size="24" fill="#173844" font-weight="900">zh-Hans</text>
<text x="1196" y="316" font-size="13" fill="#61727B" font-weight="600">跟随系统语言：开启</text>
<rect x="1172" y="370" width="196" height="154" rx="18" fill="#F8FCFB" stroke="#DCE9E6"/>
<text x="1196" y="404" font-size="14" fill="#173844" font-weight="900">扩展规则</text>
<text x="1196" y="432" font-size="13" fill="#61727B" font-weight="600">新增语言只需：</text>
<text x="1196" y="458" font-size="13" fill="#61727B" font-weight="600">1. 增加翻译资源</text>
<text x="1196" y="484" font-size="13" fill="#61727B" font-weight="600">2. 增加 allowlist</text>
<text x="1196" y="510" font-size="13" fill="#61727B" font-weight="600">3. 增加 QA 截图</text>
<rect x="1172" y="558" width="196" height="122" rx="18" fill="#FFF9F4" stroke="#F2D9C8"/>
<text x="1196" y="592" font-size="14" fill="#B36D3A" font-weight="900">缓存</text>
<text x="1196" y="620" font-size="13" fill="#61727B" font-weight="600">AI 建议、报告和通知</text>
<text x="1196" y="646" font-size="13" fill="#61727B" font-weight="600">缓存 key 必须包含 locale</text>
