<rect x="628" y="402" width="444" height="60" rx="18" fill="#F8FCFB" stroke="#DCE9E6"/>
<text x="656" y="438" font-size="16" fill="#173844" font-weight="900">English</text><text x="1000" y="438" font-size="14" fill="#61727B" font-weight="700">en</text>
