<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
<title id="title">Web 多厂商设备生态页</title><desc id="desc">HealthGuard multi-provider devices prototype.</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}.muted{fill:#61727B}.ink{fill:#173844}.teal{fill:#087B83}.label{font-size:14px;font-weight:800}.small{font-size:13px}.h1{font-size:30px;font-weight:900}.h2{font-size:18px;font-weight:900}.num{font-size:28px;font-weight:900}.line{stroke:#DCE9E6;stroke-width:1}</style>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#12343C" flood-opacity="0.10"/></filter></defs>
<rect width="1440" height="1024" fill="#F4FAF8"/><rect x="40" y="36" width="222" height="952" rx="24" fill="#FFFFFF" filter="url(#shadow)"/><circle cx="82" cy="88" r="22" fill="#DDF5EF"/><path d="M72 88h20M82 78v20" stroke="#15A3A3" stroke-width="3" stroke-linecap="round"/><text x="116" y="84" class="ink" font-size="22" font-weight="900">HealthGuard</text><text x="116" y="108" class="muted small">Web 工作台</text>
<rect x="62" y="140" width="156" height="42" rx="12" fill="#F3FBF9"/><circle cx="84" cy="161" r="6" fill="#15A3A3"/><text x="104" y="166" class="teal label">设备生态</text><text x="104" y="224" class="muted label">同步日志</text><circle cx="84" cy="219" r="6" fill="#DCE9E6"/><text x="104" y="282" class="muted label">数据源偏好</text><circle cx="84" cy="277" r="6" fill="#DCE9E6"/><text x="104" y="340" class="muted label">指标映射</text><circle cx="84" cy="335" r="6" fill="#DCE9E6"/>
<text x="300" y="88" class="muted small">多厂商设备生态 / Provider</text><text x="300" y="128" class="ink h1">设备与数据源</text><rect x="1260" y="76" width="124" height="40" rx="14" fill="#15A3A3"/><text x="1322" y="101" text-anchor="middle" fill="#FFFFFF" class="label">连接设备</text>
<rect x="300" y="164" width="250" height="126" rx="18" fill="#FFFFFF" filter="url(#shadow)"/><text x="326" y="198" class="muted label">已连接</text><text x="326" y="238" class="ink num">2 个</text><text x="326" y="268" class="muted small">Garmin、Apple Health</text>
<rect x="572" y="164" width="250" height="126" rx="18" fill="#FFFFFF" filter="url(#shadow)"/><text x="598" y="198" class="muted label">指标覆盖</text><text x="598" y="238" class="ink num">9 类</text><text x="598" y="268" class="muted small">步数、心率、睡眠等</text>
<rect x="844" y="164" width="250" height="126" rx="18" fill="#FFFFFF" filter="url(#shadow)"/><text x="870" y="198" class="muted label">同步异常</text><text x="870" y="238" class="ink num">1 个</text><text x="870" y="268" fill="#D8792A" class="small">Health Connect 待授权</text>
<rect x="1116" y="164" width="268" height="126" rx="18" fill="#FFFFFF" filter="url(#shadow)"/><text x="1142" y="198" class="muted label">默认数据源</text><text x="1142" y="238" class="ink num">Garmin</text><text x="1142" y="268" class="muted small">睡眠 / 心率优先</text>
<rect x="300" y="322" width="724" height="610" rx="22" fill="#FFFFFF" filter="url(#shadow)"/><text x="330" y="362" class="ink h2">Provider 状态</text>
<line x1="330" y1="392" x2="994" y2="392" class="line"/><text x="330" y="424" class="muted label">Provider</text><text x="540" y="424" class="muted label">能力</text><text x="760" y="424" class="muted label">最近同步</text><text x="900" y="424" class="muted label">状态</text>
<line x1="330" y1="444" x2="994" y2="444" class="line"/><text x="330" y="478" class="ink label">Garmin</text><text x="540" y="478" class="muted small">steps、heart_rate、sleep</text><text x="760" y="478" class="muted small">09:30</text><text x="900" y="478" class="teal small">connected</text>
<line x1="330" y1="506" x2="994" y2="506" class="line"/><text x="330" y="540" class="ink label">Apple Health</text><text x="540" y="540" class="muted small">weight、workout、energy</text><text x="760" y="540" class="muted small">08:12</text><text x="900" y="540" class="teal small">connected</text>
<line x1="330" y1="568" x2="994" y2="568" class="line"/><text x="330" y="602" class="ink label">Health Connect</text><text x="540" y="602" class="muted small">sleep、steps、calories</text><text x="760" y="602" class="muted small">未同步</text><text x="900" y="602" fill="#D8792A" class="small">reauth</text>
<rect x="330" y="684" width="664" height="170" rx="18" fill="#F8FCFB" stroke="#DCE9E6"/><text x="356" y="722" class="ink h2">标准化链路</text><text x="356" y="758" class="muted small">provider payload -> adapter -> normalizer -> health_metric_events</text><text x="356" y="794" class="muted small">趋势、首页、AI 和报告只消费标准化指标事件。</text>
<rect x="1052" y="322" width="332" height="610" rx="22" fill="#FFFFFF" filter="url(#shadow)"/><text x="1082" y="362" class="ink h2">指标覆盖矩阵</text>
<rect x="1082" y="392" width="272" height="64" rx="16" fill="#F3FBF9"/><text x="1104" y="430" class="ink label">睡眠：Garmin 优先</text>
<rect x="1082" y="474" width="272" height="64" rx="16" fill="#F8FCFB"/><text x="1104" y="512" class="ink label">步数：多源合并</text>
<rect x="1082" y="556" width="272" height="64" rx="16" fill="#FFF7ED"/><text x="1104" y="594" class="ink label">心率：设备数据</text>
<text x="1082" y="682" class="ink h2">冲突规则</text><text x="1082" y="718" class="muted small">手动记录优先展示</text><text x="1082" y="750" class="muted small">同 provider 用 source_record_id 去重</text><text x="1082" y="782" class="muted small">用户可设置默认数据源</text>
</svg>
