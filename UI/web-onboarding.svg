    <text x="658" y="430" font-size="20" fill="#173844" font-weight="800">身体数据</text><rect x="658" y="456" width="220" height="62" rx="14" fill="#F8FCFB" stroke="#DCE9E6" stroke-width="1"/><text x="676" y="479" font-size="13" fill="#61727B" font-weight="500">身高</text><text x="676" y="503" font-size="17" fill="#173844" font-weight="700">175 cm</text><rect x="902" y="456" width="220" height="62" rx="14" fill="#F8FCFB" stroke="#DCE9E6" stroke-width="1"/><text x="920" y="479" font-size="13" fill="#61727B" font-weight="500">体重</text><text x="920" y="503" font-size="17" fill="#173844" font-weight="700">72 kg</text><rect x="1148" y="456" width="152" height="62" rx="14" fill="#F3FBF9" stroke="#DCE9E6" stroke-width="1"/><text x="1166" y="482" font-size="13" fill="#61727B" font-weight="500">BMI</text><text x="1166" y="508" font-size="17" fill="#57B894" font-weight="800">23.5 健康</text>
    <text x="658" y="582" font-size="20" fill="#173844" font-weight="800">健康目标</text><rect x="658" y="608" width="90" height="42" rx="21" fill="#F5F7FA"/><text x="703" y="634" font-size="14" fill="#61727B" font-weight="700" text-anchor="middle">减脂</text><rect x="764" y="608" width="90" height="42" rx="21" fill="#F5F7FA"/><text x="809" y="634" font-size="14" fill="#61727B" font-weight="700" text-anchor="middle">增肌</text><rect x="870" y="608" width="120" height="42" rx="21" fill="#DDF5EF"/><text x="930" y="634" font-size="14" fill="#087B83" font-weight="700" text-anchor="middle">保持健康</text>
    <rect x="658" y="704" width="642" height="86" rx="20" fill="#F8FCFB" stroke="#DCE9E6" stroke-width="1"/><text x="684" y="738" font-size="17" fill="#173844" font-weight="800">初始目标建议</text><text x="684" y="768" font-size="15" fill="#61727B" font-weight="600">保持健康：优先稳定饮水、睡眠和每日步数，再逐步扩展饮食与运动记录。</text>
